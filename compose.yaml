services:
  backend:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./quality.db:/app/quality.db

  frontend:
    build: .
    command: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - backend

  db-viewer:
    image: coleifer/sqlite-web
    command: sqlite_web -H 0.0.0.0 /data/quality.db
    ports:
      - "8081:8080"
    volumes:
      - ./quality.db:/data/quality.db
    depends_on:
      - backend