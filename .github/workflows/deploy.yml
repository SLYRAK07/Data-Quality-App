name: Deploy

on:
  workflow_run:
    workflows: ["Tests"]
    types:
      - completed
    branches:
      - develop

jobs:
  deploy:
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Lancer le deploiement Ansible
        run: |
          cd ansible
          ansible-playbook -i inventory.ini deploy.yml
